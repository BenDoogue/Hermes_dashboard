<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FLAPPY_HERMES // RETRO GOOGLE STYLE</title>
    <style>
        body {
            background-color: #f8f9fa;
            color: #202124;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #202124;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .google-sub {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 15px;
        }
        canvas {
            border: 1px solid #dadce0;
            background: #ffffff;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            display: block;
            margin: 20px auto;
            border-radius: 8px;
        }
        .instructions {
            font-size: 14px;
            color: #1a73e8;
            font-weight: bold;
            margin-top: 10px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #1a0dab;
            background: #f1f3f4;
            border: 1px solid #dadce0;
            padding: 8px 18px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        .back-link:hover {
            background: #e8f0fe;
            border-color: #d2e3fc;
        }
    </style>
</head>
<body>

    <h2>FLAPPY_HERMES.EXE</h2>
    <div class="google-sub">Classic Retro Arcade Mini-Game &bull; Retro Google Edition</div>
    <div class="instructions">Press [SPACEBAR] or [CLICK] to Flap. Avoid the System Obstacles!</div>

    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <div>
        <a class="back-link" href="index.html">&larr; Return to Dashboard</a>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game variables
let bird = { x: 50, y: 200, width: 22, height: 22, gravity: 0.6, lift: -10, velocity: 0 };
let pipes = [];
let frameCount = 0;
let score = 0;
let highScore = 0;
let isGameOver = false;
let gameStarted = false;

// Controls
document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        flap();
        e.preventDefault();
    }
});

canvas.addEventListener("click", function() {
    flap();
});

function flap() {
    if (isGameOver) {
        resetGame();
    } else {
        bird.velocity = bird.lift;
        gameStarted = true;
    }
}

function resetGame() {
    bird.y = 200;
    bird.velocity = 0;
    pipes = [];
    score = 0;
    frameCount = 0;
    isGameOver = false;
    gameStarted = false;
}

function spawnPipe() {
    let gap = 130;
    let minHeight = 50;
    let maxHeight = canvas.height - gap - 50;
    let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

    pipes.push({
        x: canvas.width,
        top: height,
        bottom: canvas.height - height - gap,
        passed: false
    });
}

function update() {
    if (!gameStarted) return;

    // Bird physics
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // Floor and ceiling collision
    if (bird.y + bird.height >= canvas.height || bird.y <= 0) {
        isGameOver = true;
    }

    // Pipes logic
    if (frameCount % 90 === 0) {
        spawnPipe();
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= 3;

        // Collision detection
        if (
            bird.x < pipes[i].x + 45 &&
            bird.x + bird.width > pipes[i].x &&
            (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)
        ) {
            isGameOver = true;
        }

        // Score update
        if (!pipes[i].passed && pipes[i].x + 45 < bird.x) {
            score++;
            if (score > highScore) highScore = score;
            pipes[i].passed = true;
        }

        // Remove off-screen pipes
        if (pipes[i].x < -50) {
            pipes.splice(i, 1);
        }
    }

    frameCount++;
}

function draw() {
    // Clear screen (Clean white/cream retro background)
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw subtle grid lines (retro light gray)
    ctx.strokeStyle = "#f1f3f4";
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 20) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let j = 0; j < canvas.height; j += 20) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    // Draw pipes (Google Blue #4285F4 with dark border)
    ctx.fillStyle = "#4285F4";
    ctx.strokeStyle = "#1a73e8";
    for (let pipe of pipes) {
        ctx.fillRect(pipe.x, 0, 45, pipe.top);
        ctx.strokeRect(pipe.x, 0, 45, pipe.top);
        
        ctx.fillRect(pipe.x, canvas.height - pipe.bottom, 45, pipe.bottom);
        ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, 45, pipe.bottom);
    }

    // Draw bird (Google Yellow #FBBC05 with red accent & dark outline)
    ctx.fillStyle = "#FBBC05";
    ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
    ctx.strokeStyle = "#EA4335";
    ctx.lineWidth = 2;
    ctx.strokeRect(bird.x, bird.y, bird.width, bird.height);
    
    // Bird eye
    ctx.fillStyle = "#202124";
    ctx.fillRect(bird.x + 13, bird.y + 5, 4, 4);

    // Draw Score
    ctx.fillStyle = "#202124";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "left";
    ctx.fillText("SCORE: " + score, 20, 35);
    ctx.fillText("HI-SCORE: " + highScore, 20, 60);

    // Start / Game Over screens
    if (!gameStarted && !isGameOver) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#1a73e8";
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        ctx.fillText("PRESS SPACE TO START", canvas.width / 2, canvas.height / 2);
    }

    if (isGameOver) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#EA4335";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("SYSTEM CRASH (GAME OVER)", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#5f6368";
        ctx.font = "14px Arial";
        ctx.fillText("Click or Space to Reboot", canvas.width / 2, canvas.height / 2 + 20);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
